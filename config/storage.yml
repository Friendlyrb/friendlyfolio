test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage/files") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]

# Cloudflare R2. S3-compatible, so the S3 service drives it, but two of its
# gaps are load-bearing here.
#
# No `public: true`. Setting it makes Active Storage attach `acl: public-read`
# to every upload, and R2 has no ACLs -- the PUT is accepted and the object is
# never stored, so uploads "succeed" into nothing. What makes objects readable
# is the bucket's custom domain in Cloudflare, not an ACL, and public URLs are
# built by photo_variant_url from R2_PUBLIC_HOST rather than by Rails.
#
# The checksum settings are the other one: aws-sdk sends a CRC32 alongside the
# MD5 Active Storage already computes, and R2 rejects a request carrying two
# ("You can only specify one non-default checksum at a time").
r2:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  # Written onto every object so the CDN can hold it forever. Active Storage
  # keys are content-addressed and never reused, so nothing behind one of these
  # URLs can change. Cloudflare still needs a cache rule to treat them as
  # cacheable -- these keys carry no file extension, and its default eligibility
  # is extension-based -- but without the header the rule has nothing to honour.
  upload:
    cache_control: "public, max-age=31536000, immutable"
