production:
  # Direct uploads that never became a photo (a closed tab, a failed import, a
  # GPS rejection) leave a blob and an R2 object behind. Two days is far longer
  # than any import takes to attach what it uploaded.
  purge_unattached_blobs:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..2.days.ago).find_each(&:purge_later)"
    schedule: every day at 4am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
