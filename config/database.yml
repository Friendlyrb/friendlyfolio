# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Development mirrors production's three databases. The plan has the bulk bake
# happening on a laptop, and the browser importer enqueues a job per photo --
# so without a queue here, importing locally silently produces nothing.
development:
  primary:
    <<: *default
    database: storage/db/development.sqlite3
  cache:
    <<: *default
    database: storage/db/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/db/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/db/test.sqlite3

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
# Hatchbox symlinks storage/ to a shared directory on every deploy, so both the
# databases and the Active Storage files below survive releases. They are split
# into storage/db and storage/files because they have different backup
# economics: the databases are small and covered by Hatchbox backups, the blobs
# are ~15 GB and are not.
production:
  primary:
    <<: *default
    database: storage/db/production.sqlite3
  cache:
    <<: *default
    database: storage/db/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/db/production_queue.sqlite3
    migrations_paths: db/queue_migrate
